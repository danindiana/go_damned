<text text-anchor="middle" x="268" y="-98.8" font-family="Courier,monospace" font-size="14.00" fill="#c9d1d9">2009 CMB Discipline:</text>
<text text-anchor="middle" x="268" y="-83.8" font-family="Courier,monospace" font-size="14.00" fill="#c9d1d9">• Pr2 advertises LBTS (lower&#45;bound&#45;on&#45;future&#45;emissions)</text>
<text text-anchor="middle" x="268" y="-68.8" font-family="Courier,monospace" font-size="14.00" fill="#c9d1d9">• While &#45;3 is queued/in&#45;flight, Pr2.LBTS ≤ t=3</text>
<text text-anchor="middle" x="268" y="-53.8" font-family="Courier,monospace" font-size="14.00" fill="#c9d1d9">• Pr1 waits: clk[Pr2] must be &gt; t=3 before emitting N0</text>
<text text-anchor="middle" x="268" y="-38.8" font-family="Courier,monospace" font-size="14.00" fill="#c9d1d9">• Once Pr2 processes &#45;3 and updates its bound, Pr1 can safely commit</text>
<text text-anchor="middle" x="268" y="-23.8" font-family="Courier,monospace" font-size="14.00" fill="#c9d1d9">Result: Exact match to sequential ground truth.</text>
</g>
