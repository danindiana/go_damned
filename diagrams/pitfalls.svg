<polygon fill="#2d333b" stroke="black" points="519.5,-496 16.5,-496 16.5,-172 519.5,-172 519.5,-496"/>
<text text-anchor="middle" x="268" y="-480.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e">Timeline (wall&#45;clock varies due to latency/scheduling):</text>
<text text-anchor="middle" x="268" y="-449.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e">Stimulus injects: N1@t=0, N2@t=1, N3@t=2</text>
<text text-anchor="middle" x="268" y="-434.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e"> &#160;↓</text>
<text text-anchor="middle" x="268" y="-419.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e">All three spike sources fire</text>
<text text-anchor="middle" x="268" y="-404.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e"> &#160;↓</text>
<text text-anchor="middle" x="268" y="-389.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e">Three CM events traverse (possibly different) processors &amp; wires:</text>
<text text-anchor="middle" x="268" y="-374.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e"> &#160;• CM(N1→N0, impact@t=3, w=+2) via local or Pr1→Pr1</text>
<text text-anchor="middle" x="268" y="-359.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e"> &#160;• CM(N2→N0, impact@t=3, w=+2) via local or Pr1→Pr1</text>
<text text-anchor="middle" x="268" y="-344.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e"> &#160;• CM(N3→N0, impact@t=3, w=&#45;3) via wire from Pr2 to Pr1 [LATENCY!]</text>
<text text-anchor="middle" x="268" y="-329.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e"> &#160;↓</text>
<text text-anchor="middle" x="268" y="-314.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e">Race: If Pr1 processes the two +2 impacts first (before the &#45;3 arrives),</text>
<text text-anchor="middle" x="268" y="-299.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e">it may prematurely commit N0@t=3. But &#45;3 is still in flight!</text>
<text text-anchor="middle" x="268" y="-284.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e"> &#160;↓</text>
<text text-anchor="middle" x="268" y="-269.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e">Result of COMMITTING too early:</text>
<text text-anchor="middle" x="268" y="-254.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e"> &#160;N0&#39;s potential: 2+2=4 ≥ theta=4 → FIRES</text>
<text text-anchor="middle" x="268" y="-239.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e"> &#160;(But if &#45;3 had arrived: 2+2&#45;3=1 &lt; 4 → never fires)</text>
<text text-anchor="middle" x="268" y="-224.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e"> &#160;↓</text>
<text text-anchor="middle" x="268" y="-209.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e">Ground truth (sequential): N0 NEVER FIRES</text>
<text text-anchor="middle" x="268" y="-194.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e">Straggler guard (2006): N0 FIRES incorrectly</text>
<text text-anchor="middle" x="268" y="-179.8" font-family="Courier,monospace" font-size="14.00" fill="#8b949e">CMB guard (2009): N0 never commits until Pr2&#39;s LBTS &gt; t=3</text>
</g>
