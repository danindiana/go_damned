<text text-anchor="start" x="18" y="-40.7" font-family="Helvetica,sans-Serif" font-size="11.00" fill="#adbac7">All rows: one computation at a time, as in the paper. With several at once, 2009P3 also fails the 3 local networks; 2009L does not.</text>
<text text-anchor="start" x="18" y="-28.7" font-family="Helvetica,sans-Serif" font-size="11.00" fill="#adbac7">The paper&#39;s rule is correct here only as 2009P3: own clock included AND ≤ acting as strict &lt;. Which reading the authors meant needs the printed page.</text>
<text text-anchor="start" x="18" y="-16.7" font-family="Helvetica,sans-Serif" font-size="11.00" fill="#adbac7">Algorithm 3 was read from a text extraction of the PDF; the tp_i = de and te_j = 0 shortcuts are not modelled.</text>
