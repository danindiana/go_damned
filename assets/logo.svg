<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .text { font-family: monospace; font-weight: bold; fill: #58a6ff; }
      .neuron { fill: #238636; stroke: #58a6ff; stroke-width: 2; }
      .spike { fill: #d29922; }
      .synapse { stroke: #79c0ff; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="200" height="200"/>

  <!-- Title -->
  <text class="text" x="100" y="30" font-size="16" text-anchor="middle">DAMNED</text>

  <!-- Network diagram: neurons and spikes -->
  <circle class="neuron" cx="50" cy="80" r="12"/>
  <circle class="neuron" cx="150" cy="80" r="12"/>
  <circle class="neuron" cx="100" cy="140" r="12"/>

  <!-- Synapses -->
  <path class="synapse" d="M 60 85 Q 85 100 90 135"/>
  <path class="synapse" d="M 140 85 Q 115 100 110 135"/>

  <!-- Spikes (impact indicators) -->
  <circle class="spike" cx="70" cy="110" r="4"/>
  <circle class="spike" cx="130" cy="110" r="4"/>

  <!-- Subtitle text -->
  <text class="text" x="100" y="175" font-size="11" text-anchor="middle">Distributed Event-Driven SNN</text>

  <!-- Decorative processor boxes (corners) -->
  <rect x="10" y="10" width="8" height="8" fill="#58a6ff" opacity="0.6"/>
  <rect x="182" y="10" width="8" height="8" fill="#58a6ff" opacity="0.6"/>
  <rect x="10" y="182" width="8" height="8" fill="#238636" opacity="0.6"/>
  <rect x="182" y="182" width="8" height="8" fill="#238636" opacity="0.6"/>
</svg>
